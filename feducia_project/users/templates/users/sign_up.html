{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDUCIA - Sign Up</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2f7 0%, #b3d9e6 40%, #89c4d9 100%);
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #2c3e50;
        }
        .signup-container {
            background: linear-gradient(180deg, #e0f2f8 0%, #ffffff 50%);
            padding: 45px 30px; border-radius: 40px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 100%; max-width: 320px; text-align: center;
        }
        .logo-title { font-size: 34px; font-weight: 300; color: #1a2b3c; letter-spacing: 2px; text-transform: uppercase; }
        .slogan { font-size: 11px; color: #7f8c8d; margin-bottom: 30px; font-style: italic; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #5a6a7a; font-size: 13px; padding-left: 12px; font-weight: 500; }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 14px 16px; border: none; border-radius: 20px; outline: none; font-size: 14px;
            box-shadow: 0 4px 15px rgba(130, 180, 210, 0.15);
            box-sizing: border-box;
        }

        .privacy-container { display: flex; align-items: center; justify-content: flex-start; margin: 20px 0; gap: 10px; font-size: 12px; color: #556b7d; }
        .privacy-container input { width: 16px; height: 16px; cursor: pointer; }
        .privacy-container a { color: #72b9d0; text-decoration: none; font-weight: 600; }

        .privacy-container label { display: inline; margin: 0; padding: 0; }

        #privacy-error { color: #e74c3c; font-size: 11px; display: none; text-align: left; padding-left: 12px; margin-bottom: 10px; }
        button {
            width: 100%; padding: 16px; background: linear-gradient(90deg, #8ad3e6, #5eb5d5);
            color: white; border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer;
        }
        .divider { display: flex; align-items: center; margin: 20px 0; color: #7f8c8d; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #7f8c8d; opacity: 0.3; }
        .google-btn {
            display: flex; align-items: center; justify-content: center; width: 100%; padding: 14px;
            border-radius: 30px; background: white; color: #2c3e50; text-decoration: none; font-weight: 600;
            border: 1px solid rgba(94, 181, 213, 0.4); box-sizing: border-box;
        }
        .google-btn img { width: 20px; margin-right: 12px; }
        .login-link { margin-top: 25px; font-size: 13px; color: #7f8c8d; }
        .login-link a { color: #5eb5d5; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="logo-title">FIDUCIA</div>
        <div class="slogan">trust in Ai trust in you</div>

        <form id="signup-form" method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="mail@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="privacy-container">
                <input type="checkbox" id="privacy_policy_check" name="privacy_policy">
                <label for="privacy_policy_check">
                    I agree to the <a href="{% url 'private_policy' %}" target="_blank">Privacy Policy</a> and <a href="{% url 'terms_of_use' %}" target="_blank">Terms of Use</a>
                </label>
            </div>
            <div id="privacy-error">You must agree to the terms.</div>

            <button type="submit">Create Account</button>
        </form>

        <div class="divider"><span>or</span></div>
        <a href="{% provider_login_url 'google' %}" class="google-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
            Continue with Google
        </a>

        <div class="login-link">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </div>
    </div>

    <script>
        document.getElementById("signup-form").addEventListener("submit", function(e) {
            if (!document.getElementById("privacy_policy_check").checked) {
                e.preventDefault();
                document.getElementById("privacy-error").style.display = "block";
            }
        });
    </script>
</body>
</html>
