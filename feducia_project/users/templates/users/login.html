<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiducia - Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;

            background: linear-gradient(135deg, #e0f2f7 0%, #b3d9e6 40%, #89c4d9 100%);

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 50px 40px;
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            width: 380px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 10px;
            color: #1d3557;
            font-size: 38px;
            text-transform: uppercase;
            padding-left: 10px;
        }

        .subtitle {
            font-style: italic;
            font-size: 13px;
            color: #457b9d;
            margin-bottom: 40px;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #1d3557;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 10px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.5);
            background: #ffffff;
            box-sizing: border-box;
            outline: none;
            color: #1d3557;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: 0.3s;
        }

        input:focus {
            box-shadow: 0 4px 15px rgba(137, 196, 217, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 25px;
            border: none;
            background-color: #89c4d9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(137, 196, 217, 0.4);
        }

        button:hover {
            background-color: #72bcd4;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(137, 196, 217, 0.5);
        }

        .signup-link {
            margin-top: 30px;
            font-size: 13px;
            color: #457b9d;
        }

        .signup-link a {
            color: #89c4d9;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>FIDUCIA</h1>
        <div class="subtitle">trust in ai trust in you</div>

        <form method="post">
            {% csrf_token %}

            <div class="input-group">
                <label>Ім'я користувача</label>
                <input type="text" name="username" placeholder="Введіть ім'я" required>
            </div>

            <div class="input-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="********" required>
            </div>

            <button type="submit">Увійти</button>
        </form>

        <div class="signup-link">
            Ще не маєте акаунту? <a href="#">Зареєструватися</a>
        </div>
    </div>

</body>
</html>
