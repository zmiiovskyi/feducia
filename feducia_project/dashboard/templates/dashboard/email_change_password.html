<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDUCIA - Set New Password</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0f2f7 0%, #b3d9e6 40%, #89c4d9 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 420px;
            background: #ffffff;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: #1a2b3c;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #5a6a7a;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #d0e4f0;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #5eb5d5;
        }

        .error-message {
            color: #ff5252;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        .rules {
            font-size: 13px;
            color: #8fa0b3;
            margin-top: 20px;
            padding-left: 20px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(90deg, #8ad3e6, #5eb5d5);
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(94, 181, 213, 0.3);
            transition: transform 0.2s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Set New Password</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="password">New password:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm new password:</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>

            {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
            {% endif %}

            <ul class="rules">
                <li>Minimum 8 characters long</li>
                <li>Must match the confirmation field</li>
                <li>Avoid using common words</li>
            </ul>

            <button type="submit" class="btn-submit">
                Update Password
            </button>
        </form>
    </div>

</body>
</html>
