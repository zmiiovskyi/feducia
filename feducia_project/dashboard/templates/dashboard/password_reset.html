<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiducia - Reset Password</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2f7 0%, #b3d9e6 40%, #89c4d9 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reset-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 50px 40px;
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            width: 380px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 8px;
            color: #1d3557;
            font-size: 32px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 14px;
            color: #457b9d;
            margin: 15px 0 35px 0;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: #1d3557;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 15px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.5);
            background: #ffffff;
            box-sizing: border-box;
            outline: none;
            color: #1d3557;
            transition: 0.3s;
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 25px;
            border: none;
            background-color: #89c4d9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(137, 196, 217, 0.4);
        }

        button:hover {
            background-color: #72bcd4;
            transform: translateY(-2px);
        }

        .back-link {
            margin-top: 25px;
            font-size: 13px;
        }

        .back-link a {
            color: #457b9d;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <h1>RESET</h1>
        <div class="subtitle">Enter your email and we'll send you instructions to reset your password.</div>

        <form method="post">
            <div class="input-group">
                <label for="id_email">Email Address</label>
                <input type="email" name="email" id="id_email" placeholder="mail@example.com" required>
            </div>

            <button type="submit">Send Instructions</button>
        </form>

        <div class="back-link">
            Remembered? <a href="{% url 'login' %}">Back to Login</a>
        </div>
    </div>

</body>
</html>
