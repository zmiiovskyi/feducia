<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDUCIA - Edit Profile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e0f2f7 0%, #b3d9e6 40%, #89c4d9 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 450px;
        }
        .form-title {
            color: #1a2b3c;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            font-weight: 600;
        }

        .avatar-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 25px auto;
        }
        .avatar-circle {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #9caebb, #7b8b9e);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(123, 139, 158, 0.25);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            border: 3px solid white;
            box-sizing: border-box;
        }
        .avatar-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 1;
        }
        .avatar-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 43, 60, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 2;
        }
        .avatar-circle:hover .avatar-overlay {
            opacity: 1;
        }
        .avatar-overlay svg { width: 20px; height: 20px; color: white; margin-bottom: 4px; }
        .avatar-overlay span { color: white; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        .edit-badge {
            position: absolute;
            bottom: 0px;
            right: 0px;
            width: 30px;
            height: 30px;
            background: linear-gradient(90deg, #8ad3e6, #5eb5d5);
            border: 2px solid white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s ease, background 0.2s ease;
            z-index: 5;
        }
        .edit-badge:hover {
            transform: scale(1.1);
            background: linear-gradient(90deg, #7bc5d9, #4da8ca);
        }

        .upload-status {
            text-align: center;
            font-size: 12px;
            color: #5eb5d5;
            margin-top: -15px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
        }

        .form-group p {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            color: #5a6a7a;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            padding: 12px 15px;
            border: 1px solid #d0e4f0;
            border-radius: 12px;
            font-size: 15px;
            margin-top: 5px;
            outline: none;
            transition: all 0.2s ease;
            color: #1a2b3c;
            box-sizing: border-box;
            width: 100%;
        }
        .form-group input:focus {
            border-color: #5eb5d5;
            box-shadow: 0 0 0 3px rgba(94, 181, 213, 0.2);
        }
        .helptext {
            font-size: 12px;
            color: #8fa0b3;
            margin-top: 4px;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #8ad3e6, #5eb5d5);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
            box-shadow: 0 8px 20px rgba(94, 181, 213, 0.3);
            transition: transform 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(94, 181, 213, 0.4);
        }
        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #8fa0b3;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .cancel-link:hover {
            color: #1a2b3c;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Edit Profile</h2>

        <div class="avatar-wrapper">
            <input type="file" id="editAvatarInput" accept="image/*" style="display: none;">

            <div class="avatar-circle" id="editAvatarBtn">
                <svg id="editDefaultIcon" width="45" height="45" viewBox="0 0 24 24" fill="#e0e6ed" style="position: absolute; z-index: 0;"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v2h20v-2c0-3.33-6.67-5-10-5z"/></svg>
                <img id="editAvatarPreview" class="avatar-preview" src="{% if user.profile.avatar %}{{ user.profile.avatar.url }}{% else %}#{% endif %}" alt="Photo" style="{% if user.profile.avatar %}display: block;{% else %}display: none;{% endif %}">
                <div class="avatar-overlay">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    <span>Change</span>
                </div>
            </div>

            <div class="edit-badge" id="editBadgeBtn" title="Change Photo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"></path>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                </svg>
            </div>
        </div>

        <div id="uploadStatus" class="upload-status">Uploading...</div>

        <form method="POST" class="form-group" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn-submit">Save Changes</button>
        </form>

        <a href="{% url 'profile' %}" class="cancel-link">Cancel and return</a>
    </div>

    <script>
        const editAvatarBtn = document.getElementById('editAvatarBtn');
        const editBadgeBtn = document.getElementById('editBadgeBtn');
        const editAvatarInput = document.getElementById('editAvatarInput');
        const editAvatarPreview = document.getElementById('editAvatarPreview');
        const editDefaultIcon = document.getElementById('editDefaultIcon');
        const uploadStatus = document.getElementById('uploadStatus');

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : getCookie('csrftoken');

        editAvatarBtn.addEventListener('click', () => editAvatarInput.click());
        editBadgeBtn.addEventListener('click', () => editAvatarInput.click());

        editAvatarInput.addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            uploadStatus.style.display = 'block';
            uploadStatus.innerText = 'Uploading...';
            uploadStatus.style.color = '#5eb5d5';

            const reader = new FileReader();
            reader.onload = function(e) {
                editAvatarPreview.src = e.target.result;
                editAvatarPreview.style.display = 'block';
                editDefaultIcon.style.display = 'none';
            };
            reader.readAsDataURL(file);

            const formData = new FormData();
            formData.append('avatar', file);

            try {
                const response = await fetch('/profile/upload-avatar/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrftoken },
                    body: formData
                });

                if (!response.ok) throw new Error('Upload failed');

                uploadStatus.innerText = 'Photo updated successfully!';
                uploadStatus.style.color = '#4CAF50';

                setTimeout(() => {
                    uploadStatus.style.display = 'none';
                }, 3000);

            } catch (error) {
                console.error(error);
                uploadStatus.innerText = 'Error saving photo.';
                uploadStatus.style.color = '#ff5252';
            }
        });
    </script>
</body>
</html>
