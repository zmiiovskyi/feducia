<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDUCIA - Change Password</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e0f2f7 0%, #b3d9e6 40%, #89c4d9 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 400px;
        }
        .form-title {
            color: #1a2b3c;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }
        /* Стилі для форми, яку генерує Django */
        .form-group p {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
            color: #5a6a7a;
            font-size: 14px;
        }
        .form-group input {
            padding: 10px 15px;
            border: 1px solid #d0e4f0;
            border-radius: 10px;
            font-size: 15px;
            margin-top: 5px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            border-color: #5eb5d5;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #8ad3e6, #5eb5d5);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(94, 181, 213, 0.3);
            transition: transform 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
        }
        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #8fa0b3;
            text-decoration: none;
            font-size: 14px;
        }
        .cancel-link:hover {
            color: #1a2b3c;
        }
        .errorlist {
            color: #ff5252;
            list-style: none;
            padding: 0;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">Change Password</h2>

        <form method="POST" class="form-group">
            {% csrf_token %} {{ form.as_p }}

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <a href="{% url 'profile' %}" class="cancel-link">Cancel and back to profile</a>
    </div>

</body>
</html>
