<!DOCTYPE html>
<html>
<body style="
    margin:0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #e0f2f7);
">

<div style="
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
">

    <div style="
        width:420px;
        background:white;
        border-radius:20px;
        padding:35px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.1);
    ">

        <h2 style="letter-spacing:3px;">FIDUCIA</h2>

        <p style="color:#6b7280;">trust in AI trust in you</p>

        <h3>Reset Password</h3>

        <p style="color:#374151;">
            Hello {{ user }},<br><br>
            Click the button below to reset your password.
        </p>

        <a href="{{ reset_link }}"
           style="
           display:inline-block;
           margin-top:20px;
           padding:12px 25px;
           border-radius:10px;
           background: linear-gradient(135deg, #3b82f6, #06b6d4);
           color:white;
           text-decoration:none;
           font-weight:bold;
        ">
            Reset Password
        </a>

        <p style="font-size:12px; margin-top:20px;">
            Or use this link:
        </p>

        <p style="font-size:12px; color:#3b82f6;">
            {{ reset_link }}
        </p>

    </div>

</div>

</body>
</html>
