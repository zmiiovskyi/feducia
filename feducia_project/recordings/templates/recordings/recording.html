{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'recordings/css/recording.css' %}">
    <title>FIDUCIA - Record Rehearsal</title>
</head>
<body>
    <form style="display: none;">
    {% csrf_token %}
    </form>
    <a href="/dashboard/" class="back-button">← Back</a>
    <div class="header-space"></div>

    <div class="video-container">
        <video id="camera-preview" autoplay muted playsinline></video>
    </div>

    <div class="center-container">
        <p class="subtitle" id="status-text">Take a deep breath. Press start when you are ready.</p>

        <div class="action-buttons">
            <button id="start-btn" class="btn btn-start">▶ Start</button>
            <button id="stop-btn" class="btn btn-stop" disabled>⏹ Stop</button>
        </div>
    </div>

    <script src="{% static 'recordings/js/recording.js' %}"></script>
</body>
</html>
