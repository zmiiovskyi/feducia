{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'recordings/css/recording.css' %}">
    <title>FIDUCIA - Record Rehearsal</title>
</head>
<body>
    <form style="display: none;">{% csrf_token %}</form>

    <a href="/dashboard/" class="btn-back"><span>&larr;</span> Back</a>
    <div class="header-space"></div>

    <div class="video-container">
        <video id="camera-preview" autoplay muted playsinline></video>
        <div id="teleprompter-overlay" class="teleprompter-overlay">
            <div id="teleprompter-text"></div>
        </div>
    </div>

    <div class="center-container">
        <div class="status-wrapper">
            <p id="status-text" class="status-text">Ready to record or rehearse?</p>
            <div id="timer-display" class="timer" style="display: none;">00:00</div>
        </div>

        <div class="action-buttons">
            <button id="start-btn" class="btn btn-start">▶ Start</button>
            <button id="restart-btn" class="btn-restart" style="display: none;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2v6h-6"></path>
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                    <path d="M3 22v-6h6"></path>
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                </svg>
                Restart
            </button>
            <button id="stop-btn" class="btn btn-stop" disabled>⏹ Stop</button>

            <div class="text-action-group" id="text-action-group">
                <button id="open-modal-btn" type="button" class="btn-text-setup">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                    <span id="teleprompter-btn-text">Add Teleprompter</span>
                </button>
                <button id="delete-text-btn" type="button" class="btn-text-delete" style="display: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div id="text-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Teleprompter Script</h2>

            <div class="speed-control-group">
                <label>Reading Speed:</label>
                <div class="speed-buttons">
                    <button type="button" class="btn-speed" data-speed="105">Slow</button>
                    <button type="button" class="btn-speed active" data-speed="145">Medium</button>
                    <button type="button" class="btn-speed" data-speed="185">Fast</button>
                </div>
            </div>

            <textarea id="teleprompter-input" placeholder="Paste your script here..."></textarea>

            <div class="modal-actions">
                <button id="save-text-btn" type="button" class="btn-modal-save">Save & Close</button>
            </div>
        </div>
    </div>

    <script src="{% static 'recordings/js/recording.js' %}"></script>
    <script>
        const stopBtn = document.getElementById('stop-btn');

        stopBtn.addEventListener('click', function() {
            if (typeof startFiduciaLoader === "function") {
                startFiduciaLoader();
            }
        });
    </script>
</body>
</html>
