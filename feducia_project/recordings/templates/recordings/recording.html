<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDUCIA - Record Rehearsal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #e0f2f7 0%, #b3d9e6 40%, #89c4d9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        .back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            text-decoration: none;
            color: #2c3e50;
            font-size: 16px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .back-button:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }
        .center-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .call-to-action {
            font-size: 28px;
            font-weight: 600;
            color: #1a2b3c;
            margin-bottom: 10px;
            margin-top: 0;
        }
        .subtitle {
            font-size: 15px;
            color: #5a6a7a;
            margin-bottom: 40px;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .btn {
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            text-decoration: none;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-start {
            background: linear-gradient(90deg, #8ad3e6, #5eb5d5);
        }
        .btn-start:hover {
            box-shadow: 0 10px 25px rgba(94, 181, 213, 0.4);
            transform: translateY(-2px);
        }
        .btn-stop {
            background: linear-gradient(90deg, #ff7e7e, #ff5252);
        }
        .btn-stop:hover {
            box-shadow: 0 10px 25px rgba(255, 82, 82, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <a href="/" class="back-button">← Back</a>

    <div class="center-container">
        <h1 class="call-to-action">Ready to practice?</h1>
        <p class="subtitle">Take a deep breath. Press start when you are ready to record your rehearsal.</p>

        <div class="action-buttons">
            <form action="/start-recording/" method="POST">
                <button type="submit" class="btn btn-start">▶ Start</button>
            </form>

            <form action="/stop-recording/" method="POST">
                <button type="submit" class="btn btn-stop">⏹ Stop</button>
            </form>
        </div>
    </div>

</body>
</html>
